# Project-wide Gradle settings.
# GitHub Actions ubuntu-latest runners have 16GB RAM and 4 cores.
# Give Gradle maximum resources for fastest possible builds.
org.gradle.jvmargs=-Xmx12g -Xms8g -XX:MaxMetaspaceSize=4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Kotlin daemon — max memory for compilation
kotlin.daemon.jvmargs=-Xmx6g -Xms4g -XX:+UseG1GC
# Parallel builds using all cores
org.gradle.parallel=true
# Configuration cache
org.gradle.configuration-cache=true
# Build cache for incremental builds
org.gradle.build-cache=true
# Use all available CPU cores
org.gradle.workers.max=4
# Enable daemon for faster subsequent tasks
org.gradle.daemon=true
# Increase daemon timeout so it stays alive through the build
org.gradle.daemon.idletimeout=600000
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
