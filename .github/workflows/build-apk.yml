# Builds a debug APK on every push and PR, and on manual dispatch.
# Artifacts are uploaded to GitHub Actions — you can download the APK
# straight to your phone from the Actions tab of your GitHub fork.
#
# This is the recommended path if you only have a phone (Termux can't
# run the x86_64 NDK host toolchains).

name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Pin JAVA_HOME to JDK 17 for the whole job. setup-android@v3
      # switches JAVA_HOME to Java 11 (needed by sdkmanager), which
      # then breaks AGP 8.5 (requires 17). We restore it explicitly
      # before the gradle step.
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      JAVA_HOME_17_X64: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 accepts packages as a single space-separated
          # string. Using single quotes is the safest YAML form — avoids
          # any ambiguity with the semicolons in package names like
          # 'platforms;android-34' and avoids the literal-block-scalar
          # form that some YAML parsers in older action runners
          # misinterpret.
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - name: Restore JDK 17 as default JAVA_HOME
        # setup-android@v3 sets JAVA_HOME to Java 11 for sdkmanager.
        # AGP 8.5 needs Java 17. Force it back.
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH
          java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waylandie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
