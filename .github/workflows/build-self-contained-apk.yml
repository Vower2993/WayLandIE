# Builds a fully self-contained WayLandIE APK with bundled rootfs.
#
# This workflow:
#   1. Sets up QEMU binfmt for arm64 cross-build (rootfs built on x86_64 runner)
#   2. Builds the imagefs.tar.xz rootfs (~150 MB, cached between runs)
#   3. Fetches the static proot binary (~3 MB, cached)
#   4. Builds the APK with everything bundled (~250 MB APK)
#   5. Uploads the APK as an artifact
#
# First run: ~30-40 minutes (rootfs build is slow due to QEMU emulation)
# Cached runs: ~10 minutes (rootfs + proot reused)
#
# The resulting APK is fully self-contained — no Termux, no PC, no
# additional downloads needed. Users install and tap "Initialize
# Environment" once.

name: Build Self-Contained APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      JAVA_HOME_17_X64: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -----------------------------------------------------------------
      # QEMU binfmt — required for arm64 chroot on x86_64 runner
      # -----------------------------------------------------------------
      - name: Set up QEMU binfmt for arm64 cross-build
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static debootstrap binfmt-support
          # Register binfmt handlers (usually auto-registered by qemu-user-static postinst)
          sudo update-binfmts --enable qemu-aarch64 || true
          # Verify binfmt is registered
          if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "✓ qemu-aarch64 binfmt registered"
          else
            echo "⚠ qemu-aarch64 binfmt not found — arm64 chroot may fail"
          fi

      # -----------------------------------------------------------------
      # Cache the imagefs tarball — expensive to build (~25 min)
      # Cache key: hash of build-imagefs.sh. If script changes, rebuild.
      # -----------------------------------------------------------------
      - name: Cache imagefs tarball
        id: cache-imagefs
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/imagefs/imagefs.tar.xz
          key: imagefs-${{ hashFiles('tools/build-imagefs.sh') }}-v3

      - name: Cache proot binary
        id: cache-proot
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libproot.so
          key: proot-v5.1.0-aarch64-static-v1

      - name: Cache adrenotools binary
        id: cache-adrenotools
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libadrenotools.so
          key: adrenotools-pipetto-v1

      # -----------------------------------------------------------------
      # Build the rootfs (only on cache miss)
      # -----------------------------------------------------------------
      - name: Build imagefs rootfs
        if: steps.cache-imagefs.outputs.cache-hit != 'true'
        run: |
          echo "=== Building imagefs rootfs (this takes ~25 minutes) ==="
          # Run the build script. It uses sudo internally for chroot.
          # On GitHub runners, sudo is passwordless.
          sudo bash tools/build-imagefs.sh

          # Verify output
          if [ ! -f app/src/main/assets/imagefs/imagefs.tar.xz ]; then
            echo "ERROR: imagefs.tar.xz not created" >&2
            exit 1
          fi
          SIZE=$(stat -c%s app/src/main/assets/imagefs/imagefs.tar.xz)
          echo "✓ imagefs.tar.xz created ($SIZE bytes, $(numfmt --to=iec $SIZE))"
          
          # Sanity check: should be > 50 MB (something went wrong if smaller)
          if [ "$SIZE" -lt 52428800 ]; then
            echo "ERROR: imagefs.tar.xz is suspiciously small (< 50 MB)" >&2
            exit 1
          fi

      - name: Verify imagefs cache hit
        if: steps.cache-imagefs.outputs.cache-hit == 'true'
        run: |
          echo "✓ imagefs.tar.xz restored from cache"
          ls -la app/src/main/assets/imagefs/imagefs.tar.xz

      # -----------------------------------------------------------------
      # Fetch proot binary (only on cache miss)
      # -----------------------------------------------------------------
      - name: Fetch proot binary
        if: steps.cache-proot.outputs.cache-hit != 'true'
        run: |
          echo "=== Fetching static proot binary ==="
          mkdir -p app/src/main/jniLibs/arm64-v8a
          bash tools/fetch-proot.sh --force
          ls -la app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Verify proot cache hit
        if: steps.cache-proot.outputs.cache-hit == 'true'
        run: |
          echo "✓ libproot.so restored from cache"
          ls -la app/src/main/jniLibs/arm64-v8a/libproot.so

      # -----------------------------------------------------------------
      # Fetch adrenotools binary (only on cache miss)
      # -----------------------------------------------------------------
      - name: Fetch adrenotools binary
        if: steps.cache-adrenotools.outputs.cache-hit != 'true'
        run: |
          echo "=== Fetching libadrenotools.so from Pipetto-crypto ==="
          mkdir -p app/src/main/jniLibs/arm64-v8a
          bash tools/fetch-adrenotools.sh --force
          ls -la app/src/main/jniLibs/arm64-v8a/libadrenotools.so

      - name: Verify adrenotools cache hit
        if: steps.cache-adrenotools.outputs.cache-hit == 'true'
        run: |
          echo "✓ libadrenotools.so restored from cache"
          ls -la app/src/main/jniLibs/arm64-v8a/libadrenotools.so

      # -----------------------------------------------------------------
      # Android SDK setup
      # -----------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            tools
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Restore JDK 17 as default JAVA_HOME
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH
          java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # -----------------------------------------------------------------
      # Build the APK
      # -----------------------------------------------------------------
      - name: Verify all bundled assets present
        run: |
          echo "=== Pre-build verification ==="
          echo "imagefs.tar.xz:"
          ls -la app/src/main/assets/imagefs/imagefs.tar.xz
          echo
          echo "libproot.so:"
          ls -la app/src/main/jniLibs/arm64-v8a/libproot.so
          echo
          echo "WayLandIE Java sources:"
          find app/src/main/java/io/waylandie -name "*.java" | wc -l
          echo
          echo "Native sources:"
          find app/src/main/cpp -name "*.c" -o -name "*.cpp" -o -name "*.h" | wc -l

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # -----------------------------------------------------------------
      # Upload the APK
      # -----------------------------------------------------------------
      - name: Show APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          echo
          echo "APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          echo "MD5: $(md5sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: waylandie-self-contained-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
            app/build/outputs/logs/
          retention-days: 7

      # -----------------------------------------------------------------
      # Also upload the imagefs + proot separately so they can be
      # downloaded and inspected if needed
      # -----------------------------------------------------------------
      - name: Upload imagefs tarball (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: imagefs-tarball
          path: app/src/main/assets/imagefs/imagefs.tar.xz
          if-no-files-found: warn
          retention-days: 7
